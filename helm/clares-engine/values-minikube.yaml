replicaCount: 1

fullnameOverride: clares

image:
  repository: devopsart1/clares-engine
  tag: "v1.0.17"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 80
  targetPort: 3002

env:
  DB_HOST: "clares-postgres-postgresql.clares.svc.cluster.local"
