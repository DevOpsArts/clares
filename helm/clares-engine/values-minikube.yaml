  DB_USER: "clares"
  SSL_MODE: "false"
  JWT_EXPIRES_IN: "8h"
  PORT: "3002"
  CLIENT_ORIGIN: ""

secrets:
  DB_PASSWORD: "clares123"
  JWT_SECRET: "clares-minikube-secret-key-2026"
